
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GST Chatbot</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="chat-container">

        <!-- Header -->
        <div class="chat-header">
            <div class="bot-icon">🤖</div>

            <div>
                <h1>GST Chatbot</h1>
                <p>GST related information assistant</p>
            </div>
            <button id="clear-chat">Clear Chat</button>
        </div>


        <!-- Chat Area -->
        <div class="chat-area">

            <div class="message bot-message">
                <strong>GST Bot</strong>
                <p>
                    Hello! 👋 Welcome to GST Chatbot.
                    How can I help you with GST today?
                </p>
            </div>


            <div class="message user-message">
                <strong>You</strong>
                <p>What is GST?</p>
            </div>


            <div class="message bot-message">
                <strong>GST Bot</strong>
                <p>
                    GST stands for Goods and Services Tax.
                    It is an indirect tax applicable to the supply
                    of goods and services.
                </p>
            </div>

        </div>


        <!-- Input Area -->
        <div class="input-area">

            <input
                type="text"
                placeholder="Type your GST question..."
            >

            <button>Send</button>

        </div>

    </div>

</body>
<script src="script.js"></script>
</html>
